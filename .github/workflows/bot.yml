name: Rubika File Compressor Bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: processed_ids.json
          key: rubika-bot-state-v3-${{ github.run_id }}
          restore-keys: |
            rubika-bot-state-v3-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg ghostscript

      - name: Run bot (one-shot)
        env:
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
        run: python bot_oneshot.py

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: processed_ids.json
          key: rubika-bot-state-v3-${{ github.run_id }}
