name: Rubika File Compressor Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download previous offset/state
        uses: actions/download-artifact@v4
        with:
          name: bot-state
          path: .
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg ghostscript

      - name: Run bot (one-shot)
        env:
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
        run: python bot_oneshot.py

      - name: Upload offset/state for next run
        uses: actions/upload-artifact@v4
        with:
          name: bot-state
          path: |
            offset.txt
            user_states.json
          retention-days: 7
          if-no-files-found: ignore
